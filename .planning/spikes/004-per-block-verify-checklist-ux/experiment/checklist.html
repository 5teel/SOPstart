<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spike 004 — Per-Block Verify Checklist</title>
<style>
  :root {
    --bg: #f6f5f1; /* paper */
    --panel: #fbfaf6;
    --ink: #1b1d24;
    --muted: #6c7080;
    --line: #d6d2c4;
    --accent: #2b5fbd;       /* blueprint blue */
    --approve: #2e7d4f;
    --decline: #b94b4b;
    --flag: #c25a13;
    --highlight: rgba(255, 211, 74, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 280px 1fr 380px; height: 100vh; }
  /* Left rail */
  #rail { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #rail h1 { font-size: 13px; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; }
  #progress { font-size: 36px; font-weight: 600; }
  #progress small { font-size: 14px; font-weight: 400; color: var(--muted); }
  #progressBar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: var(--approve); transition: width 80ms ease-out; }
  #flagSummary { font-size: 12px; color: var(--flag); }
  #publish { padding: 12px 16px; background: var(--ink); color: var(--bg); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: opacity 100ms; }
  #publish:disabled { opacity: 0.35; cursor: not-allowed; }
  .legend { font-size: 11px; color: var(--muted); margin-top: auto; line-height: 1.6; }
  .legend kbd { background: #1b1d24; color: #fbfaf6; padding: 1px 6px; border-radius: 3px; font-family: ui-monospace, monospace; font-size: 10px; }
  /* Middle: block list */
  #list { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; transition: border-color 100ms; }
  .block.focused { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(43,95,189,0.15); }
  .block.has-flag { border-left: 4px solid var(--flag); }
  .block.approved { background: #ecf3ed; }
  .block.declined { background: #f7e7e7; }
  .ordinal { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .kind-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--line); color: var(--ink); margin-right: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kind-heading { background: #1b1d24; color: #fbfaf6; }
  .kind-photo { background: #2b5fbd; color: white; }
  .kind-hazard { background: #c25a13; color: white; }
  .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .text { font-size: 13px; color: var(--ink); }
  .meta { font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 6px; }
  .btn { padding: 6px 10px; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; background: white; cursor: pointer; transition: background 80ms; }
  .btn-approve { color: var(--approve); }
  .btn-approve:hover, .btn-approve.active { background: var(--approve); color: white; border-color: var(--approve); }
  .btn-decline { color: var(--decline); }
  .btn-decline:hover, .btn-decline.active { background: var(--decline); color: white; border-color: var(--decline); }
  .flag-list { grid-column: 1 / -1; padding: 8px 10px; background: #fff3e6; border-radius: 4px; font-size: 12px; color: var(--ink); margin-top: 6px; }
  .flag-list .flag { padding: 4px 0; }
  .flag-list .flag .sev { color: var(--flag); font-weight: 600; font-size: 11px; text-transform: uppercase; margin-right: 6px; }
  /* Right: source pane */
  #source { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  #source h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  #sourceText { font: 13px/1.55 ui-monospace, monospace; white-space: pre-wrap; color: var(--ink); }
  /* Status pill */
  #status { position: fixed; top: 8px; right: 8px; background: var(--ink); color: var(--bg); padding: 4px 10px; border-radius: 3px; font-size: 11px; font-family: ui-monospace, monospace; opacity: 0.85; }
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <h1>Per-Block Verify</h1>
    <div>
      <div id="progress"><span id="approvedCount">0</span><small>/<span id="totalCount">0</span></small></div>
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
    <div id="flagSummary"></div>
    <button id="publish" disabled>Publish SOP</button>
    <div class="legend">
      Click a block, then <kbd>A</kbd> approve · <kbd>D</kbd> decline. <kbd>J</kbd>/<kbd>K</kbd> next/prev. <kbd>Enter</kbd> view source. No bulk-tick. No trust-score skip.
    </div>
  </aside>
  <main id="list"></main>
  <aside id="source">
    <h2>Source context</h2>
    <div id="sourceText">Click a block to view the source page that contains it.</div>
  </aside>
</div>
<div id="status">init</div>
<script type="module" src="./checklist.js"></script>
</body>
</html>
