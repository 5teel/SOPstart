<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>009 · SOP-first home</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { overflow: hidden; }
  #variant-nav { flex-wrap: wrap; }
  #variant-nav .grp { display: flex; gap: 6px; align-items: center; margin-left: 14px; }
  #variant-nav label { color: rgba(255,255,255,.5); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  #variant-nav select { font-family: var(--mono); font-size: 11px; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 2px; padding: 4px 6px; }
  #variant-nav select option { color: #000; }
  #stage { position: fixed; inset: 44px 0 0 0; display: flex; align-items: center; justify-content: center; background: var(--paper-2); }
  #frame { position: relative; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
  #stage.phone #frame { width: 390px; height: 844px; max-height: calc(100vh - 64px); border-radius: 28px; border: 10px solid var(--ink-900); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  #app { position: absolute; inset: 0; overflow: hidden; }

  /* ---------- wordmark ---------- */
  .wm { display: inline-flex; align-items: baseline; font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; color: var(--ink-900); position: relative; white-space: nowrap; line-height: 1.1; }
  .wm .b { font-weight: 500; }
  .wm::after { content: ''; position: absolute; left: 0; bottom: -0.12em; height: 0.12em; width: 100%; background: var(--brand-yellow); border-radius: 2px; }
  .wm.sweep::after { width: 0; transition: width .25s ease-out; }
  .wm.sweep.on::after { width: 100%; }

  /* ---------- shared bits ---------- */
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--ink-300); background: var(--paper-1); border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 13px; }
  .btn.primary { background: var(--ink-900); color: #fff; border-color: var(--ink-900); }
  .start-btn { height: 60px; min-width: 180px; padding: 0 28px; border-radius: 10px; background: var(--ink-900); color: #fff; border: 0; font-size: 18px; font-weight: 700; }
  .sop-chip { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 5px; background: var(--ink-900); color: #fff; font-family: var(--sans); font-weight: 800; font-size: 13px; letter-spacing: -0.01em; }
  .label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-500); margin: 22px 0 6px; }
  .search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--ink-300); background: var(--paper-1); border-radius: 10px; padding: 0 12px; height: 44px; }
  .search input { border: 0; outline: 0; flex: 1; font: inherit; font-size: 15px; background: transparent; }
  .search .x { border: 0; background: none; color: var(--ink-500); font-size: 16px; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 10px; border-radius: 8px; min-height: 56px; }
  .row:hover { background: var(--paper-2); }
  .row.sel { background: var(--ink-900); color: #fff; }
  .row.sel .meta, .row.sel .st { color: rgba(255,255,255,.7); }
  .row .main { flex: 1; min-width: 0; }
  .row .ttl { font-weight: 600; font-size: 14.5px; }
  .row .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-500); }
  .row .sw { width: 4px; align-self: stretch; border-radius: 2px; }
  .st { font-size: 12px; color: var(--ink-600); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 99px; display: inline-block; flex: none; }
  .d-ok { background: var(--accent-ok); } .d-upd { background: var(--accent-step); } .d-wait { background: var(--accent-decision); } .d-prog { background: var(--ink-900); border: 1px solid #fff; outline: 1px solid var(--ink-900); }
  .tg { font-family: var(--mono); font-size: 10px; color: var(--accent-inspect); background: rgba(124,58,237,.08); border-radius: 3px; padding: 1px 6px; }
  .seg { display: inline-flex; border: 1px solid var(--ink-300); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: var(--paper-1); padding: 5px 10px; font-size: 12px; }
  .seg button.on { background: var(--ink-900); color: #fff; }
  .grp-h { font-family: var(--mono); font-size: 11px; color: var(--ink-600); padding: 12px 10px 2px; display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none; text-align: left; }
  button.grp-h:hover { color: var(--ink-900); }
  .grp-h .sq { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 7px; }
  .toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink-900); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 50; }
  .empty { color: var(--ink-500); text-align: center; padding: 60px 20px; }
  .scroll { overflow-y: auto; }
  .filterchip { display: inline-flex; gap: 8px; align-items: center; background: var(--paper-2); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; margin-top: 12px; }
  .filterchip button { border: 0; background: none; }

  /* ---------- Variant A: library + reader ---------- */
  .A { display: grid; grid-template-columns: 220px 400px 1fr; height: 100%; }
  .A .side { border-right: 1px solid var(--ink-200); display: flex; flex-direction: column; padding: 18px 12px; background: var(--paper); }
  .A .side .wm { font-size: 20px; margin: 0 8px 26px; }
  .A .side nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px; border-radius: 8px; font-size: 14px; }
  .A .side nav button.on { background: var(--paper-2); font-weight: 700; }
  .A .side nav button.quiet { color: var(--ink-500); font-size: 13px; }
  .A .side .who { margin-top: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-500); padding: 8px; }
  .A .list { border-right: 1px solid var(--ink-200); padding: 18px 14px; }
  .A .pane { background: var(--paper-1); min-height: 0; }

  /* ---------- Variant B: search-first column ---------- */
  .B { height: 100%; display: flex; flex-direction: column; }
  .B .top { display: flex; align-items: center; gap: 22px; padding: 14px 28px; border-bottom: 1px solid var(--ink-200); }
  .B .top .wm { font-size: 20px; }
  .B .top nav { display: flex; gap: 4px; }
  .B .top nav button { border: 0; background: none; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; }
  .B .top nav button.on { background: var(--paper-2); font-weight: 700; }
  .B .top nav button.quiet { color: var(--ink-500); }
  .B .top .who { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-500); }
  .B .col { max-width: 780px; margin: 0 auto; padding: 34px 24px 80px; }
  .B .search { height: 56px; border-radius: 14px; font-size: 17px; }
  .B .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .B .card { text-align: left; border: 1px solid var(--ink-200); background: var(--paper-1); border-radius: 10px; padding: 12px 14px; min-height: 104px; display: flex; flex-direction: column; gap: 6px; }
  .B .card:hover { border-color: var(--ink-400); }
  .B .card .ttl { font-weight: 700; font-size: 14.5px; }
  .B .card .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-500); }
  .B .card .st { margin-top: auto; white-space: normal; align-items: baseline; }
  .B .mapbox { height: 440px; border: 1px solid var(--ink-200); border-radius: 10px; overflow: hidden; margin-top: 8px; }

  /* ---------- read view ---------- */
  .read { max-width: 760px; margin: 0 auto; padding: 30px 32px 80px; }
  .read .back { display: block; border: 0; background: none; color: var(--ink-600); padding: 0; margin-bottom: 18px; font-size: 13px; }
  .read h1 { font-size: 28px; line-height: 1.15; margin: 10px 0 6px; letter-spacing: -0.01em; }
  .read .meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-500); }
  .read .act { display: flex; align-items: center; gap: 14px; margin: 22px 0 6px; flex-wrap: wrap; }
  .read .act .note { font-size: 13px; color: var(--ink-600); }
  .read .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .read .stline { margin-top: 12px; }
  .read ol { padding: 0; margin: 0; list-style: none; counter-reset: s; }
  .read li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ink-200); font-size: 14.5px; }
  .read li::before { counter-increment: s; content: counter(s); font-family: var(--mono); font-size: 11px; color: var(--ink-500); width: 22px; padding-top: 3px; }
  .kind { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 3px; border: 1px solid currentColor; height: fit-content; white-space: nowrap; }
  .k-hazard { color: var(--accent-hazard); } .k-ppe { color: var(--accent-decision); } .k-step { color: var(--accent-step); } .k-check { color: var(--accent-measure); }

  /* ---------- isometric site map ---------- */
  .mapwrap { display: flex; flex-direction: column; height: 100%; }
  .maphd { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--ink-200); min-height: 54px; }
  .maphd .crumb { font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .maphd .crumb button { border: 0; background: none; padding: 0; color: var(--ink-500); font-weight: 500; }
  .maphd .crumb button:hover { color: var(--ink-900); }
  .maphd .hint { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-500); }
  .mapsvg { flex: 1; min-height: 0; width: 100%; display: block; }
  svg.iso { user-select: none; }
  svg.iso polygon, svg.iso rect, svg.iso ellipse, svg.iso line { stroke-linejoin: round; }
  .area { cursor: pointer; transition: transform .16s ease, opacity .2s; }
  .area:hover { transform: translateY(-6px); }
  .area:hover .slab-top { stroke-width: 3; }
  .area.dim { opacity: .32; }
  .area.dim:hover { opacity: .6; transform: none; }
  .area.cur { cursor: default; }
  .area.cur:hover { transform: none; }
  .ent { cursor: pointer; }
  .ent:hover { filter: brightness(1.08) drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .ent.sel polygon, .ent.sel rect, .ent.sel ellipse { stroke: #09090b; stroke-width: 1.6; }
  .sign { pointer-events: none; }
  .elabel { pointer-events: none; font-family: Inter, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }

  /* ---------- steps screen (the SOP owns the frame) ---------- */
  .run { position: absolute; inset: 0; display: grid; grid-template-rows: 60px 3px 1fr; background: var(--paper); }
  .run .hd { display: flex; align-items: center; gap: 16px; padding: 0 22px; border-bottom: 1px solid var(--ink-200); background: var(--paper-1); }
  .run .hd .wm { font-size: 20px; }
  .run .hd .sep { width: 1px; height: 24px; background: var(--ink-300); }
  .run .hd .t { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .run .hd .x { border: 1px solid var(--ink-300); background: var(--paper-1); border-radius: 8px; padding: 7px 12px; font-size: 13px; }
  .run .bar { background: var(--ink-200); } .run .bar i { display: block; height: 100%; background: var(--ink-900); transition: width .3s; }
  .run .body { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
  .run .rail { border-right: 1px solid var(--ink-200); padding: 16px 10px; overflow-y: auto; }
  .run .rail button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--ink-600); }
  .run .rail button.cur { background: var(--paper-2); color: var(--ink-900); font-weight: 600; }
  .run .rail button.done { color: var(--ink-400); }
  .run .rail button .n { font-family: var(--mono); font-size: 11px; width: 18px; }
  .run .wc { overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; padding: 40px 32px; }
  .run .card { width: 100%; max-width: 760px; }
  .run .card .stepno { font-family: var(--mono); font-size: 12px; color: var(--ink-500); margin-left: 10px; }
  .run .card .txt { font-size: 28px; line-height: 1.3; font-weight: 600; margin: 18px 0 24px; letter-spacing: -0.01em; }
  .run .card .photo { border: 1.5px dashed var(--ink-400); border-radius: 10px; height: 120px; display: flex; align-items: center; justify-content: center; color: var(--ink-600); background: var(--paper-1); width: 100%; margin-bottom: 18px; font-size: 14px; }
  .run .card .photo.got { border-style: solid; border-color: var(--accent-ok); color: var(--accent-ok); }
  .run .card .go { width: 100%; height: 60px; border: 0; border-radius: 10px; background: var(--ink-900); color: #fff; font-size: 17px; font-weight: 700; }
  .run .card .go:disabled { background: var(--ink-300); cursor: not-allowed; }
  .run .card .prev { border: 0; background: none; color: var(--ink-600); margin-top: 14px; font-size: 13px; }
  .run .card.k-hz { border-left: 4px solid var(--accent-hazard); padding-left: 22px; }
  .run .card.k-pp { border-left: 4px solid var(--accent-decision); padding-left: 22px; }
  .run .finish { text-align: center; padding-top: 40px; }
  .run .finish .big { font-size: 40px; font-weight: 800; }

  /* ---------- fusion overlay ---------- */
  .fuse-bg { position: absolute; inset: 0; background: var(--paper); z-index: 40; pointer-events: none; }
  .fuse-wm { position: absolute; left: 50%; top: 50%; z-index: 41; transform: translate(-50%, -50%); font-size: 52px; pointer-events: none; }
  .fuse-wm.free { transform: none; }
  .fuse-wm span { display: inline-block; transform-origin: 0 0; border-radius: 5px; }

  /* ---------- tables for other sections ---------- */
  .sec { padding: 28px 32px; max-width: 880px; }
  .sec h2 { margin: 0 0 4px; font-size: 22px; }
  .sec .sub { color: var(--ink-600); font-size: 13px; margin-bottom: 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-500); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--ink-300); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--ink-200); }
  td.c { text-align: center; }

  /* ---------- phone ---------- */
  .phone .A, .phone .B { display: flex; flex-direction: column; }
  .phone .A .side, .phone .B .top { display: none; }
  .phone .A .list { border: 0; flex: 1; }
  .phone .B .col { padding: 18px 14px 90px; }
  .phone .B .cards { grid-template-columns: 1fr; }
  .phone .read { padding: 16px 16px 90px; }
  .phone .read h1 { font-size: 23px; }
  .phone .start-btn { width: 100%; }
  .phone .sec { padding: 18px 14px 90px; }
  .phone .ptop { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
  .phone .ptop .wm { font-size: 19px; }
  .phone .pmap { height: 360px; border: 1px solid var(--ink-200); border-radius: 10px; overflow: hidden; margin-top: 12px; background: var(--paper-1); }
  .phone .maphd { padding: 10px 12px; min-height: 44px; }
  .key { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .key button { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--ink-200); background: var(--paper-1); border-radius: 8px; padding: 10px 8px; font-size: 12.5px; font-weight: 600; min-height: 48px; }
  .key b { color: #fff; width: 22px; height: 22px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .key span { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-500); font-weight: 400; }
  .phone .maphd .hint { display: none; }
  .tabs { display: none; }
  .phone .tabs { display: flex; position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper-1); border-top: 1px solid var(--ink-200); z-index: 5; }
  .phone .tabs button { flex: 1; border: 0; background: none; padding: 12px 2px 16px; font-size: 11.5px; color: var(--ink-500); }
  .phone .tabs button.on { color: var(--ink-900); font-weight: 700; }
  .phone .run { grid-template-rows: 54px 3px 1fr; }
  .phone .run .hd { padding: 0 12px; gap: 10px; }
  .phone .run .hd .wm { font-size: 17px; }
  .phone .run .body { grid-template-columns: 1fr; }
  .phone .run .rail { display: none; }
  .phone .run .wc { padding: 22px 16px; }
  .phone .run .card .txt { font-size: 23px; }
  .phone .run .card.k-hz, .phone .run .card.k-pp { padding-left: 14px; }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="sketch-title">009 · SOP-first home</span>
  <button class="variant-tab active" data-v="A">★ A: Library + reader</button>
  <button class="variant-tab" data-v="B">B: Search-first column</button>
  <div class="grp"><label>View</label>
    <select id="vp"><option value="desk">Desktop</option><option value="phone">Phone</option></select></div>
  <div class="grp"><label>Role</label>
    <select id="role"><option value="worker">Worker</option><option value="supervisor">Supervisor</option><option value="admin">SOP admin</option></select></div>
  <div class="grp"><label>Start motion</label>
    <select id="motion"><option value="auto">Auto (full first today)</option><option value="full">Full ~1s</option><option value="short">Short ~0.3s</option><option value="off">Off (reduced motion)</option></select></div>
</div>

<div id="stage"><div id="frame"><div id="app"></div></div></div>

<script>
/* ---------------- data: Kauri Springs Bottling ---------------- */
// Areas are the library's sections. Each object drawn on an area is ONE SOP -- the map is the library, not a machine census.
const AREAS = [
  { id: 'intake', n: 'Bottle intake',        c: '#0891b2', x: 0,    y: 0,    w: 7,    d: 7 },
  { id: 'fill',   n: 'Filling hall',         c: '#2563eb', x: 8.5,  y: 0,    w: 9,    d: 7 },
  { id: 'label',  n: 'Labelling & packing',  c: '#7c3aed', x: 19,   y: 0,    w: 8,    d: 7 },
  { id: 'util',   n: 'Utilities & CIP',      c: '#0d9488', x: 0,    y: 8.5,  w: 7,    d: 6 },
  { id: 'lab',    n: 'Quality lab',          c: '#16a34a', x: 8.5,  y: 8.5,  w: 4.25, d: 6 },
  { id: 'eng',    n: 'Engineering workshop', c: '#475569', x: 14.25, y: 8.5, w: 4.25, d: 6 },
  { id: 'ware',   n: 'Warehouse & dispatch', c: '#d97706', x: 19,   y: 8.5,  w: 8,    d: 10 },
  { id: 'site',   n: 'Site-wide',            c: '#be185d', x: 0,    y: 16,   w: 18.5, d: 2.5 },
];
const GROUND = [-1, -1, 28, 19.5]; // x0, y0, x1, y1
const A_BY = Object.fromEntries(AREAS.map(a => [a.id, a]));
const gen = (t) => [
  { k: 'hazard', t: 'Moving parts and stored energy. Isolate before reaching in.' },
  { k: 'ppe', t: 'Safety glasses, cut-resistant gloves, safety boots, hearing protection.' },
  { k: 'step', t: 'Confirm the area is clear and tell the line lead you are starting.' },
  { k: 'step', t: 'Follow the isolation points on the tag board for ' + t.toLowerCase() + '.' },
  { k: 'step', t: 'Carry out the task as set out in the drawing on the board.', photo: true },
  { k: 'check', t: 'Guards back on, tags removed, area handed back to the line lead.' },
];
const SOPS = [
  { id: 'depal', a: 'intake', e: 'machine', t: 'Depalletiser start-up', type: 'Order of operations', v: 3, owner: 'Ana Tupou', min: 10, std: [] },
  { id: 'glassjam', a: 'intake', e: 'conveyor', t: 'Clearing a glass jam on the infeed', type: 'Machine', v: 4, owner: 'Ana Tupou', min: 6, std: ['LOTO'], st: { k: 'ok', txt: 'Signed off 2 Sep · R. Patel' } },
  { id: 'broken', a: 'intake', e: 'board', t: 'Broken glass clean-up', type: 'Process', v: 2, owner: 'Ana Tupou', min: 8, std: [] },
  { id: 'filler', a: 'fill', e: 'machine', t: 'Filler changeover 330 ml → 750 ml', type: 'Order of operations', v: 5, owner: 'Tama Ngata', min: 40, std: ['LOTO', 'Food safety'], st: { k: 'prog', txt: 'You stopped at step 4 yesterday' }, at: 3 },
  { id: 'capper', a: 'fill', e: 'machine', t: 'Capper torque check', type: 'Inspection', v: 3, owner: 'Tama Ngata', min: 5, std: ['Food safety'], st: { k: 'ok', txt: 'Signed off 28 Aug · S. Fale' } },
  { id: 'rinser', a: 'fill', e: 'conveyor', t: 'Rinser nozzle clean', type: 'Machine', v: 2, owner: 'Tama Ngata', min: 15, std: ['Food safety'] },
  { id: 'co2', a: 'fill', e: 'tank', t: 'CO₂ dosing line isolation', type: 'Process', v: 4, owner: 'Hemi Walker', min: 12, std: ['LOTO', 'Gas'] },
  { id: 'labeller', a: 'label', e: 'machine', t: 'Labeller reel change', type: 'Machine', v: 6, owner: 'Mei Lin', min: 7, std: [] },
  { id: 'casepack', a: 'label', e: 'conveyor', t: 'Case packer jam clearing', type: 'Machine', v: 4, owner: 'Mei Lin', min: 7, std: ['LOTO'], st: { k: 'ok', txt: 'Signed off 3 Sep · R. Patel' } },

const TS = 20, CO = 0.866;
const P = (x, y, z = 0) => [(x - y) * TS * CO, (x + y) * TS * 0.5 - z * TS];
const pts = (a) => a.map(p => P(...p).map(n => n.toFixed(1)).join(',')).join(' ');
const ED = 'stroke="rgba(9,9,11,.28)" stroke-width=".7"';
function mix(hex, t) { // t=0 -> white, t=1 -> hex

}
function box(x, y, z, w, d, h, top, right, left, topAttr = ED) {

    `<polygon ${ED} fill="${left}" points="${pts([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]])}"/>` +
    `<polygon ${topAttr} fill="${top}" points="${pts([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]])}"/>`;

const grey = (x, y, z, w, d, h) => box(x, y, z, w, d, h, '#e4e4e7', '#c4c4ca', '#a1a1aa');
function cyl(cx, cy, z, r, h, side, top, band) {

    <line x1="${bx - rx}" y1="${ty}" x2="${bx - rx}" y2="${by}" stroke="rgba(9,9,11,.28)" stroke-width=".7"/><line x1="${bx + rx}" y1="${ty}" x2="${bx + rx}" y2="${by}" stroke="rgba(9,9,11,.28)" stroke-width=".7"/>

}
const FOOT = { machine: [1.5, 1.2], conveyor: [2.4, 0.7], tank: [1.4, 1.4], board: [1.2, 0.14], rack: [2.2, 0.7], forklift: [1.0, 1.4], bench: [1.6, 0.8] };
const HEIGHT = { machine: 1.6, conveyor: 0.9, tank: 2.1, board: 1.7, rack: 1.9, forklift: 1.9, bench: 1.2 };
function entity(kind, x, y, c) { // (x,y) = footprint origin
  const [w, d] = FOOT[kind], z = 0.3;
  switch (kind) {

    case 'conveyor': {
      let s = box(x, y, z, w, d, 0.45, '#a1a1aa', '#71717a', '#52525b');
      for (let i = 1; i < 6; i++) { const [a1, b1] = P(x + i * w / 6, y, z + 0.45), [a2, b2] = P(x + i * w / 6, y + d, z + 0.45); s += `<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="#52525b" stroke-width=".8"/>`; }
      for (let i = 0; i < 3; i++) s += cyl(x + 0.5 + i * 0.7, y + d / 2, z + 0.45, 0.14, 0.42, mix(c, .45), mix(c, .25));

    }
    case 'tank': return cyl(x + 0.7, y + 0.7, z, 0.7, 1.7, '#cfd4dc', '#e8ebef', c);
    case 'board': return box(x + 0.04, y, z, 0.08, d, 1.6, '#71717a', '#71717a', '#52525b') + box(x + w - 0.12, y, z, 0.08, d, 1.6, '#71717a', '#71717a', '#52525b') +
      box(x, y, z + 0.7, w, d, 0.85, '#fafafa', '#e4e4e7', '#ffffff') + box(x, y, z + 1.4, w, d, 0.2, mix(c, .6), c, c) +
      [0.95, 1.1, 1.25].map(h => { const [a1, b1] = P(x + 0.18, y + d, z + h), [a2, b2] = P(x + w - 0.3, y + d, z + h); return `<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="#a1a1aa" stroke-width="1"/>`; }).join('');

      box(x + w, y + 0.2, z, 0.12, 1.0, 1.6, '#52525b', '#3f3f46', '#27272a') + box(x + w + 0.12, y + 0.3, z + 0.05, 0.9, 0.12, 0.06, '#71717a', '#52525b', '#3f3f46') + box(x + w + 0.12, y + 0.9, z + 0.05, 0.9, 0.12, 0.06, '#71717a', '#52525b', '#3f3f46');

      [0.3, 0.7, 1.1].map(o => cyl(x + o, y + 0.4, z + 0.75, 0.1, 0.3, mix(c, .35), mix(c, .2))).join('') + box(x + 1.2, y + 0.1, z + 0.75, 0.3, 0.3, 0.35, '#3f3f46', '#27272a', '#18181b');

function slots(a) { // lay this area's SOP objects out on its floor

function bounds(list) {

const corners = (a, zt) => [[a.x, a.y, 0], [a.x + a.w, a.y, 0], [a.x, a.y + a.d, 0], [a.x + a.w, a.y + a.d, 0], [a.x, a.y, zt], [a.x + a.w, a.y, zt], [a.x, a.y + a.d, zt]].map(p => P(...p));

function siteSvg() {
  const cur = S.area, vb = viewFor(cur), k = vb[2] / 800;
  let g = `<polygon fill="#e9e9ec" stroke="#d4d4d8" points="${pts([[GROUND[0], GROUND[1], 0], [GROUND[2], GROUND[1], 0], [GROUND[2], GROUND[3], 0], [GROUND[0], GROUND[3], 0]])}"/>`;
  [...AREAS].sort((p, q) => (p.x + p.y) - (q.x + q.y)).forEach(a => {
    const sl = slots(a).sort((p, q) => (p.cx + p.cy) - (q.cx + q.cy));
    const objs = sl.map(o => {
      const tag = cur === a.id ? `class="ent ${S.sop === o.s.id ? 'sel' : ''}" data-open="${o.s.id}"` : '';
      return `<g ${tag}>${entity(o.s.e, o.x, o.y, a.c)}<title>${esc(o.s.t)}</title></g>`;
    }).join('');

let raf;
function animateMap() {
  const svg = app.querySelector('svg.iso'); if (!svg) return;
  const to = svg.dataset.vb.split(' ').map(Number), from = S._vb || to; S._vb = to;
  cancelAnimationFrame(raf);

  return h + allGrouped();
}
const card = (s) => `<button class="card" data-open="${s.id}"><div class="ttl">${esc(s.t)}</div><div class="meta">${esc(s.dept)} · ~${s.min} min</div>${stHtml(s)}</button>`;

function readHtml(s, back) {
  const prog = s.st && s.st.k === 'prog';
  return `<div class="read">
    ${back ? `<button class="back" data-close>‹ ${back}</button>` : ''}
    <span class="sop-chip" id="chip">SOP</span>
    <h1>${esc(s.t)}</h1>
    <div class="meta"><span style="color:${A_BY[s.a].c}">■</span> ${esc(s.dept)} · ${esc(s.type)} · v${s.v} · owner ${esc(s.owner)} · ~${s.min} min</div>
    ${s.std.length ? `<div class="tags">${s.std.map(x => `<span class="tg">${esc(x)}</span>`).join('')}</div>` : ''}
    ${s.st ? `<div class="stline">${stHtml(s)}</div>` : ''}
    <div class="act"><button class="start-btn" id="startBtn" data-start="${s.id}">Start</button>
      <span class="note">${prog ? 'Picks up at step ' + (s.at + 1) + ' of ' + s.steps.length + ' · <a href="#" data-start="' + s.id + '" data-fresh>or begin from step 1</a>' : s.steps.length + ' steps'}</span></div>
    <div class="label">What you'll do</div>
    <ol>${s.steps.map(x => `<li><span style="flex:1">${esc(x.t)}${x.photo ? ' <span class="meta">· photo</span>' : ''}</span><span class="kind k-${x.k}">${x.k === 'ppe' ? 'PPE' : x.k}</span></li>`).join('')}</ol>
  </div>`;
}

function secHtml() {
  if (S.sec === 'record') return `<div class="sec"><h2>My record</h2><div class="sub">What you've done and who signed it off.</div>
    <table><tr><th>SOP</th><th>Last done</th><th>Status</th></tr>
    <tr><td>Lockout / tagout isolation</td><td>12 Sep</td><td><span class="st"><i class="dot d-ok"></i>Signed off · R. Patel</span></td></tr>
    <tr><td>Shift handover</td><td>6 Oct</td><td><span class="st"><i class="dot d-wait"></i>Waiting for sign-off</span></td></tr>
    <tr><td>Capper torque check</td><td>28 Aug</td><td><span class="st"><i class="dot d-ok"></i>Signed off · S. Fale</span></td></tr>
    <tr><td>Forklift pre-start check</td><td>19 Sep</td><td><span class="st"><i class="dot d-upd"></i>Signed off on v3 · now v4</span></td></tr>
    <tr><td>Case packer jam clearing</td><td>3 Sep</td><td><span class="st"><i class="dot d-ok"></i>Signed off · R. Patel</span></td></tr></table></div>`;
  if (S.sec === 'training') {
    const ppl = ['Aroha T.', 'Ben K.', 'Sione F.', 'Mei L.'], cols = ['loto', 'fork', 'capper', 'casepack', 'hand'];
    const cell = (i, j) => ['✓', '✓', '●', '', '✓', '', '✓', '●', '', '✓', '✓', '✓', '', '✓', '●', '✓', '', '✓', '✓', ''][i * 5 + j];
    return `<div class="sec"><h2>Training</h2><div class="sub">Who is signed off on what. ✓ signed off · ● done, waiting for sign-off. A record to look up, not a to-do list.</div>
      <table><tr><th>Person</th>${cols.map(c => `<th>${esc(byId[c].t)}</th>`).join('')}</tr>
      ${ppl.map((p, i) => `<tr><td>${p}</td>${cols.map((c, j) => `<td class="c" style="color:${cell(i, j) === '✓' ? 'var(--accent-ok)' : 'var(--accent-decision)'}">${cell(i, j)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  if (S.sec === 'signoffs') return `<div class="sec"><h2>Sign-offs</h2><div class="sub">Completed SOPs from your team. Each sign-off is logged in the decision ledger.</div>
    <table><tr><th>Who</th><th>SOP</th><th>Done</th><th></th></tr>
    ${[['Aroha T.', 'Shift handover', '6 Oct · 2 photos'], ['Sione F.', 'Capper torque check', '6 Oct'], ['Mei L.', 'Date-code check', '5 Oct · 1 photo']].map(r =>
      `<tr><td>${r[0]}</td><td>${r[1]}</td><td style="font-family:var(--mono);font-size:11px;color:var(--ink-500)">${r[2]}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn" data-toast="Sent back · logged in the decision ledger" data-rm>Send back</button> <button class="btn primary" data-toast="Signed off · logged in the decision ledger" data-rm>Sign off</button></td></tr>`).join('')}</table></div>`;
  if (S.sec === 'manage') return `<div class="sec"><h2>Manage SOPs</h2><div class="sub">Write, convert and fix SOPs. Every way in ends in the same editor.</div>
    <button class="btn primary" data-toast="New SOP: upload a document · describe it to AI · record a video · start blank">New SOP</button>
    <div class="label">Your drafts</div>
    <table><tr><th>Draft</th><th>Checked</th><th></th></tr>
    <tr><td>Filler changeover 330 ml → 1.5 L</td><td>12 of 30 steps</td><td style="text-align:right"><button class="btn" data-toast="Opens the editor at step 13, the next unchecked one">Carry on</button></td></tr>
    <tr><td>Ammonia refrigeration isolation</td><td>0 of 18 steps</td><td style="text-align:right"><button class="btn" data-toast="Opens the editor at step 1">Carry on</button></td></tr></table>
    <div class="label">Change requests</div>
    <table><tr><td>Forklift pre-start check · “step 6: add the fire extinguisher check”</td><td style="text-align:right"><button class="btn" data-toast="Opens the editor at step 6">Make this change</button></td></tr></table></div>`;
}

/* ---------------- render ---------------- */
function render() {
  frame.parentElement.classList.toggle('phone', S.phone);
  app.className = S.phone ? 'phone' : '';
  if (S.run) return renderRun();
  const tabs = `<div class="tabs">${sections().map(([k, l]) => `<button class="${S.sec === k ? 'on' : ''}" data-sec="${k}">${l === 'My SOPs' ? 'SOPs' : l === 'Manage SOPs' ? 'Manage' : l}</button>`).join('')}</div>`;
  const ptop = `<div class="ptop">${WM()}<span style="font-family:var(--mono);font-size:11px;color:var(--ink-500)">${S.role}</span></div>`;
  const s = S.sop && byId[S.sop];
  let h;
  if (S.v === 'A') {
    if (S.phone) {
      h = `<div class="A">${S.sec === 'sops' && !s ? ptop : ''}<div class="list scroll" style="padding-bottom:90px">${S.sec !== 'sops' ? secHtml() : s ? readHtml(s, S.pmap ? 'Site map' : 'My SOPs') : homeBody(false)}</div></div>${tabs}`;
    } else {
      const side = `<aside class="side">${WM()}<nav>${navBtns()}</nav><div class="who">${S.role} · ${ORG}</div></aside>`;
      h = S.sec === 'sops'
        ? `<div class="A">${side}<div class="list scroll">${homeBody(false)}</div><div class="pane ${s ? 'scroll' : ''}">${s ? readHtml(s, 'Site map') : mapView()}</div></div>`
        : `<div class="A">${side}<div class="pane scroll" style="grid-column:2 / 4">${secHtml()}</div></div>`;
    }
  } else {
    const inner = S.sec !== 'sops' ? secHtml() : s ? readHtml(s, 'My SOPs') : `<div class="col">${homeBody(true)}</div>`;
    h = `<div class="B"><div class="top">${WM()}<nav>${navBtns()}</nav><span class="who">${S.role} · ${ORG}</span></div>
      ${S.phone && S.sec === 'sops' && !s ? ptop : ''}<div class="scroll" style="flex:1">${inner}</div></div>${tabs}`;
  }
  app.innerHTML = h;
  animateMap();
  const q = document.getElementById('q');
  if (q && S._focus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

function renderRun() {
  const s = byId[S.run.id], i = S.run.i, n = s.steps.length;
  let body;
  if (i >= n) {
    body = `<div class="card finish"><div class="big">Done</div><p style="color:var(--ink-600)">${esc(s.t)} is recorded and sent to your supervisor for sign-off.</p>
      <button class="go" data-exit style="max-width:320px">Back to my SOPs</button></div>`;
  } else {
    const st = s.steps[i];
    const lbl = st.k === 'hazard' ? 'I understand — continue' : st.k === 'ppe' ? "I'm wearing it — continue" : i === n - 1 ? 'Done' : 'Next';
    const need = st.photo && !S.run.photos[i];
    body = `<div class="card ${st.k === 'hazard' ? 'k-hz' : st.k === 'ppe' ? 'k-pp' : ''}">
      <span class="kind k-${st.k}">${st.k === 'ppe' ? 'PPE' : st.k}</span><span class="stepno">Step ${i + 1} of ${n}</span>
      <div class="txt">${esc(st.t)}</div>
      ${st.photo ? `<button class="photo ${S.run.photos[i] ? 'got' : ''}" data-photo>${S.run.photos[i] ? '✓ Photo added' : '＋ Add a photo (this step asks for one)'}</button>` : ''}
      <button class="go" data-next ${need ? 'disabled' : ''}>${lbl}</button>
      ${i > 0 ? '<button class="prev" data-prev>‹ Back a step</button>' : ''}</div>`;
  }
  app.innerHTML = `<div class="run">
    <div class="hd">${WM('hdwm')}<span class="sep"></span><span class="t">${esc(s.t)}</span><button class="x" data-exit>${i >= n ? 'Close' : 'Stop'}</button></div>
    <div class="bar"><i style="width:${Math.min(100, (i / n) * 100)}%"></i></div>
    <div class="body"><div class="rail"><div class="label" style="margin:0 10px 8px">Steps</div>
      ${s.steps.map((x, j) => `<button class="${j === i ? 'cur' : j < i ? 'done' : ''}" ${j <= S.run.max ? `data-jump="${j}"` : 'disabled'}><span class="n">${j < i ? '✓' : j + 1}</span>${esc(x.t)}</button>`).join('')}
      <div class="label" style="margin:20px 10px 6px">This SOP</div><div style="font-family:var(--mono);font-size:11px;color:var(--ink-500);padding:0 10px">v${s.v} · owner ${esc(s.owner)}<br>${s.std.map(x => `<span class="tg">${esc(x)}</span>`).join(' ')}</div></div>
      <div class="wc">${body}</div></div></div>`;
}

/* ---------------- the fusion ---------------- */
function motionMode() {
  const m = document.getElementById('motion').value;
  if (m !== 'auto') return m;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return 'off';
  const today = new Date().toDateString();
  try { if (localStorage.getItem('sopstart-fuse-day') === today) return 'short'; localStorage.setItem('sopstart-fuse-day', today); } catch (e) {}
  return 'full';
}
const rel = (el) => { const r = el.getBoundingClientRect(), f = frame.getBoundingClientRect(); return { l: r.left - f.left - frame.clientLeft, t: r.top - f.top - frame.clientTop, w: r.width, h: r.height }; };

async function startSop(id, fresh) {
  const s = byId[id];
  const at = !fresh && s.st && s.st.k === 'prog' ? s.at : 0;
  const go = () => { S.run = { id, i: at, max: at, photos: {} }; render(); };
  const mode = motionMode();
  const chip = document.getElementById('chip'), btn = document.getElementById('startBtn');
  if (mode === 'off' || !chip || !btn || !Element.prototype.animate) return go();

  const T = mode === 'full' ? { a: 460, hold: 160, b: 420 } : { a: 150, hold: 0, b: 150 };
  const src1 = rel(chip), src2 = rel(btn);
  const bg = document.createElement('div'); bg.className = 'fuse-bg';
  const wm = document.createElement('div'); wm.className = 'fuse-wm wm sweep';
  wm.innerHTML = `<span class="a">SOP</span><span class="b">Start</span>`;
  frame.append(bg, wm);
  const [sa, sb] = wm.children;
  const d1 = rel(sa), d2 = rel(sb);
  const ease = 'cubic-bezier(.5,0,.2,1)';
  // ponytail: FLIP by hand (WAAPI) so the two parts meet in the middle; View Transitions can't hold a mid-point.
  // The pieces fly as solid black chips and only turn into ink-on-paper as they meet.
  const fly = (el, src, dst) => {
    const s = src.h / dst.h;
    const tx = src.l + src.w / 2 - dst.l - (dst.w * s) / 2, ty = src.t + src.h / 2 - dst.t - (dst.h * s) / 2;
    el.animate([{ background: '#09090b', color: '#fff', boxShadow: '0 0 0 6px #09090b' }, { background: 'transparent', color: '#09090b', boxShadow: '0 0 0 0 transparent' }],
      { duration: T.a * 0.4, delay: T.a * 0.6, easing: 'ease-in', fill: 'both' });
    return el.animate([{ transform: `translate(${tx}px,${ty}px) scale(${s})` }, { transform: 'none' }], { duration: T.a, easing: ease, fill: 'forwards' }).finished;
  };
  bg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T.a, easing: 'ease-out', fill: 'forwards' });
  await Promise.all([fly(sa, src1, d1), fly(sb, src2, d2)]);
  sb.textContent = 'start';
  wm.classList.add('on');
  wm.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(1.06)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: Math.max(T.hold, 120) });
  await new Promise(r => setTimeout(r, T.hold || 60));

  go(); // the steps screen is now under the paper veil
  const target = app.querySelector('.hdwm');
  target.style.visibility = 'hidden';
  const cur = rel(wm), tgt = rel(target);
  wm.classList.add('free');
  Object.assign(wm.style, { left: cur.l + 'px', top: cur.t + 'px' });
  const k = tgt.h / cur.h;
  bg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: T.b, easing: 'ease-in', fill: 'forwards' });
  await wm.animate([{ transform: 'none' }, { transform: `translate(${tgt.l - cur.l}px,${tgt.t - cur.t}px) scale(${k})` }],
    { duration: T.b, easing: ease, fill: 'forwards' }).finished;
  target.style.visibility = '';
  bg.remove(); wm.remove();
}

/* ---------------- events ---------------- */
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; frame.append(d);
  setTimeout(() => d.remove(), 2400);
}
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-open],[data-sec],[data-close],[data-start],[data-next],[data-prev],[data-jump],[data-exit],[data-photo],[data-group],[data-map],[data-area],[data-pmap],[data-clear],[data-toast]');
  if (!b) return;
  const d = b.dataset;
  S._focus = false;
  if ('start' in d) { e.preventDefault(); return startSop(d.start, 'fresh' in d); }
  if ('toast' in d) { toast(d.toast); if ('rm' in d) b.closest('tr').remove(); return; }
  if (d.open) S.sop = d.open;
  if (d.sec) { S.sec = d.sec; S.sop = null; }
  if ('close' in d) S.sop = null;
  if ('group' in d) S.group = d.group;
  if ('map' in d) S.showMap = !S.showMap;
  if ('pmap' in d) S.pmap = d.pmap === '1';
  if ('area' in d) { S.area = d.area || null; S.sop = null; if (S.area) { S.showMap = true; S.pmap = true; } }
  if ('clear' in d) S.q = '';
  if (S.run) {
    const s = byId[S.run.id];
    if ('next' in d) { S.run.i++; S.run.max = Math.max(S.run.max, S.run.i); if (S.run.i >= s.steps.length) s.st = { k: 'wait', txt: 'Done today · waiting for sign-off' }; }
    if ('prev' in d) S.run.i--;
    if (d.jump) S.run.i = +d.jump;
    if ('photo' in d) S.run.photos[S.run.i] = true;
    if ('exit' in d) { if (S.run.i > 0 && S.run.i < s.steps.length) { s.st = { k: 'prog', txt: 'You stopped at step ' + (S.run.i + 1) + ' today' }; s.at = S.run.i; } S.run = null; }
  }
  render();
});
app.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; S._focus = true; render(); } });
document.querySelectorAll('.variant-tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.variant-tab').forEach(x => x.classList.toggle('active', x === t)); S.v = t.dataset.v; S.run = null; S.sop = null; render();
});
document.getElementById('vp').onchange = (e) => { S.phone = e.target.value === 'phone'; S._vb = null; render(); };
document.getElementById('role').onchange = (e) => { S.role = e.target.value; if (!sections().some(([k]) => k === S.sec)) S.sec = 'sops'; S.run = null; render(); };
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (S.run) S.run = null; else if (S.sop) S.sop = null; else S.area = null; render(); });
render();
</script>
</body>
</html>
